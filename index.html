<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>仰角算定盤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- SCREEN 1: 0-60 degree grid, scrollable; opens on the 30-60 window -->
  <section class="screen" id="screen-main">
    <!-- fills the same slot the back button occupies on screens 2 and 3, so the toolbar height never changes -->
    <div class="toolbar toolbar-slot">
      <a class="btn-back" href="voice.html">🎤 音声版</a>
      <span class="brand-label">IRON NEST: Heavy Turret Simulator</span>
    </div>
    <div class="grid-wrap" id="main-wrap">
      <table class="grid-table scrollable sticky-head" id="main-table">
        <thead>
          <tr>
            <th class="corner">仰角<br>／装薬</th>
            <th class="col-head" id="main-head-1">1</th>
            <th class="col-head" id="main-head-2">2</th>
            <th class="col-head" id="main-head-3">3</th>
            <th class="col-head" id="main-head-4">4</th>
            <th class="col-head" id="main-head-5">5</th>
            <th class="col-head" id="main-head-6">6</th>
          </tr>
        </thead>
        <tbody id="main-body"></tbody>
      </table>
      <div id="main-spacer"></div>
    </div>
  </section>

  <!-- SCREEN 2: 0.1-degree detail table (scrollable) -->
  <section class="screen" id="screen-detail" hidden>
    <div class="toolbar">
      <button class="btn-back" id="btn-back">◂ 戻る</button>
      <span class="brand-label">IRON NEST: Heavy Turret Simulator</span>
    </div>
    <div class="grid-wrap" id="detail-wrap">
      <table class="grid-table scrollable sticky-head plain-cells" id="detail-table">
        <thead>
          <tr>
            <th class="corner">仰角<br>／装薬</th>
            <th class="col-head" data-charge="1">1</th>
            <th class="col-head" data-charge="2">2</th>
            <th class="col-head" data-charge="3">3</th>
            <th class="col-head" data-charge="4">4</th>
            <th class="col-head" data-charge="5">5</th>
            <th class="col-head" data-charge="6">6</th>
          </tr>
        </thead>
        <tbody id="detail-body"></tbody>
      </table>
    </div>
  </section>

  <!-- SCREEN 3: 0.01-degree fine grid around the tapped 0.1-degree row -->
  <section class="screen" id="screen-fine" hidden>
    <div class="toolbar">
      <button class="btn-back" id="btn-back2">◂ 戻る</button>
      <span class="brand-label">IRON NEST: Heavy Turret Simulator</span>
    </div>
    <div class="grid-wrap">
      <table class="grid-table rows-21 plain-cells" id="fine-table">
        <thead>
          <tr>
            <th class="corner">仰角<br>／装薬</th>
            <th class="col-head" data-charge="1">1</th>
            <th class="col-head" data-charge="2">2</th>
            <th class="col-head" data-charge="3">3</th>
            <th class="col-head" data-charge="4">4</th>
            <th class="col-head" data-charge="5">5</th>
            <th class="col-head" data-charge="6">6</th>
          </tr>
        </thead>
        <tbody id="fine-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
(function(){
  var ANGLE_MIN = 0, ANGLE_MAX = 60;
  var DEFAULT_VIEW_ANGLE = 30;
  var CHARGES = [1,2,3,4,5,6];

  function dist(charge, angle){ return charge * angle / 12; }
  function fmt2(n){ return n.toFixed(2); }
  function fmt1(n){ return n.toFixed(1); }

  var mainTable = document.getElementById('main-table');
  var mainWrap = document.getElementById('main-wrap');
  var mainBody = document.getElementById('main-body');
  var mainSpacer = document.getElementById('main-spacer');
  var rowsHtml = '';
  for (var a = ANGLE_MIN; a <= ANGLE_MAX; a++){
    rowsHtml += '<tr data-angle="' + a + '"><th class="row-head">' + a + '</th>';
    for (var c = 0; c < CHARGES.length; c++){
      var charge = CHARGES[c];
      rowsHtml += '<td><button type="button" data-angle="' + a + '" data-charge="' + charge + '">' + fmt2(dist(charge, a)) + '</button></td>';
    }
    rowsHtml += '</tr>';
  }
  mainBody.innerHTML = rowsHtml;

  var DEFAULT_WINDOW_ROWS = (ANGLE_MAX - DEFAULT_VIEW_ANGLE + 1) + 1; // 31 data rows + header

  function sizeMainRows(){
    // pick the tallest row height (capped) that still lets the full
    // 30-60 window fit the actual viewport - critical on short phone
    // screens where the desktop-tuned clamp() would overflow and force
    // an unwanted scroll before reaching row 60
    mainSpacer.style.height = '0px';
    var rowPx = Math.floor(mainWrap.clientHeight / DEFAULT_WINDOW_ROWS);
    rowPx = Math.max(16, Math.min(32, rowPx));
    mainTable.style.gridAutoRows = rowPx + 'px';
  }

  function scrollMainToDefault(){
    sizeMainRows();
    // measure against a zeroed spacer each time so this stays idempotent
    // no matter how many times or when it runs (font swap, load, etc.)
    mainSpacer.style.height = '0px';
    var targetRow = mainBody.querySelector('tr[data-angle="' + DEFAULT_VIEW_ANGLE + '"]');
    var targetCell = targetRow ? targetRow.querySelector('th') : null;
    var headerCell = mainTable.querySelector('thead th.corner');
    if (!targetCell || !headerCell) return;
    var wrapRect = mainWrap.getBoundingClientRect();
    var cellRect = targetCell.getBoundingClientRect();
    var headerRect = headerCell.getBoundingClientRect();
    // this resolves to the row's true absolute position regardless of
    // the current scroll offset, so repeated calls converge, not compound
    var desiredScrollTop = mainWrap.scrollTop + (cellRect.top - wrapRect.top) - headerRect.height;
    var maxScrollNoSpacer = mainWrap.scrollHeight - mainWrap.clientHeight;
    // the viewport can be taller than the 30-60 window; grow the spacer
    // below the last row only by however much extra headroom is needed
    // so row 30 can reach the very top without the scroll clamping short
    mainSpacer.style.height = Math.max(0, desiredScrollTop - maxScrollNoSpacer) + 'px';
    mainWrap.scrollTop = desiredScrollTop;
  }
  requestAnimationFrame(function(){
    scrollMainToDefault();
    requestAnimationFrame(scrollMainToDefault);
  });
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(scrollMainToDefault);
  }
  window.addEventListener('load', scrollMainToDefault);
  // mobile browsers resize the viewport as the address bar shows/hides;
  // re-fit whenever that happens so the 30-60 window keeps fitting
  window.addEventListener('resize', scrollMainToDefault);

  var screenMain = document.getElementById('screen-main');
  var screenDetail = document.getElementById('screen-detail');
  var detailBody = document.getElementById('detail-body');
  var btnBack = document.getElementById('btn-back');
  var detailWrap = document.getElementById('detail-wrap');

  var state = { centerAngle: ANGLE_MIN, selectedMainBtn: null, detailCharge: null, fineCharge: null };
  var detailBuilt = false;

  function buildDetailRows(){
    var html = '';
    var steps = Math.round((ANGLE_MAX - ANGLE_MIN) * 10);
    for (var i = 0; i <= steps; i++){
      var angle = Math.round((ANGLE_MIN + i * 0.1) * 10) / 10;
      var isInt = Math.round(angle * 10) % 10 === 0;
      html += '<tr data-angle="' + angle + '"' + (isInt ? ' class="int-row"' : '') + '><th class="row-head">' + fmt1(angle) + '</th>';
      for (var c = 0; c < CHARGES.length; c++){
        html += '<td data-charge="' + CHARGES[c] + '">' + fmt2(dist(CHARGES[c], angle)) + '</td>';
      }
      html += '</tr>';
    }
    detailBody.innerHTML = html;
    detailBuilt = true;
  }

  function applyColSelection(screenEl, charge){
    var cells = screenEl.querySelectorAll('[data-charge]');
    for (var i = 0; i < cells.length; i++){
      var isSelected = charge == null || Number(cells[i].dataset.charge) === charge;
      cells[i].classList.toggle('col-dim', !isSelected);
    }
  }

  function setHitRow(angle, opts){
    opts = opts || {};
    state.centerAngle = angle;
    var rows = detailBody.querySelectorAll('tr');
    var target = null, closestDiff = Infinity;
    for (var r = 0; r < rows.length; r++){
      rows[r].classList.remove('hit');
      var rowAngle = Number(rows[r].dataset.angle);
      var diff = Math.abs(rowAngle - angle);
      if (diff < closestDiff){ closestDiff = diff; target = rows[r]; }
    }
    if (!target) return;
    target.classList.add('hit');
    if (opts.flash){
      target.classList.add('flash');
      setTimeout(function(){ target.classList.remove('flash'); }, 550);
    }
    if (opts.scroll){
      requestAnimationFrame(function(){
        var cell = target.querySelector('th');
        if (!cell) return;
        var wrapRect = detailWrap.getBoundingClientRect();
        var cellRect = cell.getBoundingClientRect();
        var delta = (cellRect.top - wrapRect.top) - (detailWrap.clientHeight / 2) + (cellRect.height / 2);
        detailWrap.scrollTop = Math.max(0, detailWrap.scrollTop + delta);
      });
    }
  }

  function openDetail(angle, charge){
    if (!detailBuilt) buildDetailRows();
    screenMain.hidden = true;
    screenDetail.hidden = false;
    state.detailCharge = charge;
    applyColSelection(screenDetail, charge);
    setHitRow(angle, { flash:true, scroll:true });
  }

  mainBody.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    if (state.selectedMainBtn) state.selectedMainBtn.classList.remove('selected');
    btn.classList.add('selected');
    state.selectedMainBtn = btn;
    openDetail(Number(btn.dataset.angle), Number(btn.dataset.charge));
  });

  detailBody.addEventListener('click', function(e){
    var row = e.target.closest('tr[data-angle]');
    if (!row) return;
    var cell = e.target.closest('td[data-charge]');
    if (cell){
      state.detailCharge = Number(cell.dataset.charge);
      applyColSelection(screenDetail, state.detailCharge);
    }
    var angle = Number(row.dataset.angle);
    if (row.classList.contains('hit')){
      openFine(angle, state.detailCharge, screenDetail);
    } else {
      setHitRow(angle, { flash:true, scroll:false });
    }
  });

  btnBack.addEventListener('click', function(){
    screenDetail.hidden = true;
    screenMain.hidden = false;
  });

  /* ---------- level 3: 0.01-degree fine grid, window around the tapped 0.1-degree row ---------- */
  var screenFine = document.getElementById('screen-fine');
  var fineBody = document.getElementById('fine-body');
  var fineTable = document.getElementById('fine-table');
  var btnBack2 = document.getElementById('btn-back2');

  function buildFineRows(center){
    var startCents = Math.round((center - 0.1) * 100);
    var html = '';
    var count = 0;
    for (var i = 0; i <= 20; i++){
      var cents = startCents + i;
      var angle = cents / 100;
      if (angle < ANGLE_MIN - 1e-9 || angle > ANGLE_MAX + 1e-9) continue;
      var isTick = ((cents % 10) + 10) % 10 === 0;
      html += '<tr data-angle="' + angle.toFixed(2) + '"' + (isTick ? ' class="int-row"' : '') + '><th class="row-head">' + angle.toFixed(2) + '</th>';
      for (var c = 0; c < CHARGES.length; c++){
        html += '<td data-charge="' + CHARGES[c] + '">' + fmt2(dist(CHARGES[c], angle)) + '</td>';
      }
      html += '</tr>';
      count++;
    }
    fineBody.innerHTML = html;
    fineTable.style.gridTemplateRows = 'auto repeat(' + count + ', 1fr)';
    applyColSelection(screenFine, state.fineCharge);
  }

  function setFineHit(angle, opts){
    opts = opts || {};
    var rows = fineBody.querySelectorAll('tr');
    var target = null, closestDiff = Infinity;
    for (var r = 0; r < rows.length; r++){
      rows[r].classList.remove('hit');
      var rowAngle = Number(rows[r].dataset.angle);
      var diff = Math.abs(rowAngle - angle);
      if (diff < closestDiff){ closestDiff = diff; target = rows[r]; }
    }
    if (!target) return;
    target.classList.add('hit');
    if (opts.flash){
      target.classList.add('flash');
      setTimeout(function(){ target.classList.remove('flash'); }, 550);
    }
  }

  function openFine(angle, charge, fromScreen){
    state.fineCharge = charge;
    state.fineReturnScreen = fromScreen || screenDetail;
    buildFineRows(angle);
    state.fineReturnScreen.hidden = true;
    screenFine.hidden = false;
    setFineHit(angle, { flash:true });
  }

  fineBody.addEventListener('click', function(e){
    var row = e.target.closest('tr[data-angle]');
    if (!row) return;
    var cell = e.target.closest('td[data-charge]');
    if (cell){
      state.fineCharge = Number(cell.dataset.charge);
      applyColSelection(screenFine, state.fineCharge);
    }
    setFineHit(Number(row.dataset.angle), { flash:true });
  });

  btnBack2.addEventListener('click', function(){
    screenFine.hidden = true;
    (state.fineReturnScreen || screenDetail).hidden = false;
  });

  /* ---------- deep link from voice.html: ?angle=52&charge=3 jumps straight to the fine screen ---------- */
  var params = new URLSearchParams(location.search);
  var linkedAngle = parseFloat(params.get('angle'));
  var linkedCharge = parseFloat(params.get('charge'));
  if (isFinite(linkedAngle) && CHARGES.indexOf(linkedCharge) !== -1 &&
      linkedAngle >= ANGLE_MIN && linkedAngle <= ANGLE_MAX){
    openFine(linkedAngle, linkedCharge, screenMain);
  }
})();
</script>
</body>
</html>
